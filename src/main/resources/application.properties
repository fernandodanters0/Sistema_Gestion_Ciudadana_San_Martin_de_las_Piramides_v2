spring.application.name=sige-backend
server.port=8080

# Configuración de base de datos MySQL
spring.datasource.url=jdbc:mysql://localhost:3306/sige_gestion_ciudadana?useUnicode=true&characterEncoding=UTF-8
spring.datasource.username=sige_dev
spring.datasource.password=dev_password
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Configuración Hibernate / JPA
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Flyway Migraciones
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true